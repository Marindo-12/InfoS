services:
  app:
    image: serversideup/php:8.3-fpm-alpine
    container_name: centre_app
    restart: unless-stopped
    working_dir: /var/www
    dns:
      - 192.168.0.1
    extra_hosts:
      - "smtp.gmail.com:173.194.76.109"
    volumes:
      - .:/var/www
    depends_on:
      - postgres
      - redis
    networks:
      - centre_network

  nginx:
    image: nginx:alpine
    container_name: centre_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - centre_network

  postgres:
    image: postgres:16-alpine
    container_name: centre_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - centre_network

  redis:
    image: redis:alpine
    container_name: centre_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - centre_network

  queue:
    image: serversideup/php:8.3-fpm-alpine
    container_name: centre_queue
    restart: unless-stopped
    working_dir: /var/www
    dns:
      - 192.168.0.1
    extra_hosts:
      - "smtp.gmail.com:173.194.76.109"
    volumes:
      - .:/var/www
    command: php artisan queue:work --tries=3 --sleep=3
    depends_on:
      - postgres
      - redis
    networks:
      - centre_network

networks:
  centre_network:
    driver: bridge

volumes:
  postgres_data:
